# Nom du workflow
name: CD

# Déclencheurs
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

# Processus
jobs:
  deploy:
    # Déploie seulement si les tests de la CI ont réussi et si la branche est master
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master'

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"