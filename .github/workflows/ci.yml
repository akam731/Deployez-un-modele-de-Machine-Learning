# Nom du workflow
name: CI

# Déclencheurs : push sur master, develop et les branches feature/*
on:
  push:
    branches: ["master", "develop", "feature/**"]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    # Conteneur Postgres démarré à côté du job (tests d'intégration)
    services:
      postgres:
        image: postgres:16

        # Identifiants et nom de la base créés au démarrage du conteneur
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: technova_test

        # Expose le port 5432 du conteneur sur localhost:5432 du runner
        ports:
          - 5432:5432

        # Options pour attendre que Postgres accepte les connexions avant de passer à la suite
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Variable lue par l'app : pointe vers le service Postgres ci-dessus
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/technova_test


    steps:
      # Récupère le code du dépôt
      - uses: actions/checkout@v4

      # Installe uv et Python 3.13
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      # Installe les dépendances à partir du lockfile
      - run: uv sync --frozen

      # Initialisation de la base de données
      - run: uv run python -m scripts.create_db --force

      # Exécute la suite de tests
      - run: uv run pytest