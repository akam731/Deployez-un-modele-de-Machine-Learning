# Nom du workflow
name: CI

# Déclencheurs : push sur master, develop et les branches feature/*
on:
  push:
    branches: ["master", "develop", "feature/**"]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    # Service PostgreSQL pour les tests d'intégration
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: technova_test
        ports:
          - 5432:5432
        # Attend que Postgres soit prêt avant de lancer les steps
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # URL de connexion utilisée par l'application pendant les tests
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/technova_test

    steps:
      # Récupère le code du dépôt
      - uses: actions/checkout@v4

      # Installe uv et Python 3.13
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      # Installe les dépendances à partir du lockfile
      - run: uv sync --frozen

      # Exécute la suite de tests
      - run: uv run pytest